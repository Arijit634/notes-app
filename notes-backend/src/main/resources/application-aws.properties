spring.application.name=notes-backend

# Server configuration for Elastic Beanstalk Corretto.
server.port=${SERVER_PORT:5000}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.compression.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Database configuration is supplied by Elastic Beanstalk environment variables.
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.hikari.pool-name=notes-aws-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA configuration.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# Security.
spring.app.jwtSecret=${JWT_SECRET:change-this-secret-in-elastic-beanstalk}
spring.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# Frontend / backend public URLs.
frontend.url=${FRONTEND_URL:https://d3j8utz8n117oc.cloudfront.net}
app.base.url=${BASE_URL:https://d3a30owjkn98ox.cloudfront.net}
oauth2.redirect.base-url=${OAUTH2_REDIRECT_BASE_URL:https://d3a30owjkn98ox.cloudfront.net}
oauth2.base.url=${OAUTH2_REDIRECT_BASE_URL:https://d3a30owjkn98ox.cloudfront.net}

# File uploads.
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS.
cors.allowed-origins=${CORS_ORIGINS:https://d3j8utz8n117oc.cloudfront.net}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Actuator.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.build.enabled=true
management.info.env.enabled=true
management.info.git.enabled=true

# Logging.
logging.level.org.springframework.security=WARN
logging.level.com.project.notes_backend=INFO
logging.level.root=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Cache.
spring.cache.type=caffeine
spring.cache.caffeine.spec=initialCapacity=100,maximumSize=1000,expireAfterWrite=10m

# OAuth2.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_REDIRECT_BASE_URL:https://d3a30owjkn98ox.cloudfront.net}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.github.scope=user:email
spring.security.oauth2.client.registration.github.redirect-uri=${OAUTH2_REDIRECT_BASE_URL:https://d3a30owjkn98ox.cloudfront.net}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-name=GitHub

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=id

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id

# Email.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# API documentation.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# Rate limiting.
app.rate-limit.default-requests-per-minute=${RATE_LIMIT_DEFAULT_RPM:600}
app.rate-limit.authenticated-requests-per-minute=${RATE_LIMIT_AUTH_RPM:1200}
app.rate-limit.admin-requests-per-minute=${RATE_LIMIT_ADMIN_RPM:500}
app.rate-limit.default-burst-limit=${RATE_LIMIT_DEFAULT_BURST:100}
app.rate-limit.authenticated-burst-limit=${RATE_LIMIT_AUTH_BURST:200}
app.rate-limit.admin-burst-limit=${RATE_LIMIT_ADMIN_BURST:50}
app.rate-limit.cache-max-size=${RATE_LIMIT_CACHE_SIZE:10000}
app.rate-limit.cache-expire-minutes=${RATE_LIMIT_CACHE_EXPIRE:60}

# Activity management.
app.activity.retention.days=${ACTIVITY_RETENTION_DAYS:7}
app.activity.cleanup.enabled=${ACTIVITY_CLEANUP_ENABLED:true}
app.activity.max-activities-per-user=${ACTIVITY_MAX_PER_USER:1000}
app.activity.display.dashboard-limit=${ACTIVITY_DASHBOARD_LIMIT:5}
app.activity.display.max-recent-days=${ACTIVITY_RECENT_DAYS:7}

# Scheduling.
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:3}
